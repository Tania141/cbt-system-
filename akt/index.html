<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКТ СИСТЕМ</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- Двата екрана живеят в една страница; сменят се по адреса (#/plot, #/obekt/…).
     Старото ПВА (../index.html) стои непокътнато и работи както досега. -->

<!-- `js/01-osnova.js` слуша Enter и пита за този елемент. Новото ПВА няма
     вход, но без него всяко натискане на Enter гърми в конзолата. -->
<div id="login-screen" hidden></div>

<header class="shapka">
    <div class="shapka-ime"><a href="#/plot">АКТ СИСТЕМ</a></div>
    <!-- Горе на плота: търсене и „+ нов обект“. Нищо друго. -->
    <div class="shapka-plot" id="shapka-plot">
        <input type="text" class="tarsene" id="plot-tarsene" placeholder="Търси по ПИ, ник, адрес или строеж…"
               oninput="plotTarsi(this.value)">
        <span class="brojach" id="plot-brojach"></span>
        <button class="bt" data-izgled="raboti" onclick="plotSmeniIzgled('raboti')">в работа</button>
        <button class="bt" data-izgled="arhiv" onclick="plotSmeniIzgled('arhiv')">архив</button>
        <button class="bt bt-glaven" onclick="plotNovObekt()">+ нов обект</button>
    </div>
    <!-- На обекта: само обратният път. -->
    <a class="bt" id="shapka-nazad" href="#/plot" hidden>← плотът</a>
</header>

<main class="telo">
    <!-- ЕКРАН 1 -->
    <section id="ekran-plot">
        <div id="plot-spisak"></div>
    </section>

    <!-- ЕКРАН 2 -->
    <section id="ekran-obekt" hidden>
        <div id="obekt-telo"></div>
    </section>

    <!-- ЕКРАН 5 -->
    <section id="ekran-sobstvenost" hidden>
        <h1 class="moment-ime">Собствеността</h1>
        <div id="sobstvenost-telo"></div>
    </section>

    <!-- ЕКРАН 4 -->
    <section id="ekran-proekt" hidden>
        <h1 class="moment-ime">Проектът — записките</h1>
        <div id="proekt-telo"></div>
    </section>

    <!-- ЕКРАН 3 -->
    <section id="ekran-moment" hidden>
        <h1 class="moment-ime" id="moment-zaglavie"></h1>
        <div id="moment-telo"></div>
    </section>
</main>

<!-- Кое липсва: всяко число се отваря тук (правило 2) -->
<div id="obekt-kutiya" onclick="if(event.target===this)obektZatvoriKutiya()">
    <div class="kutiya-list">
        <div id="obekt-kutiya-telo"></div>
        <div style="margin-top:14px;text-align:right">
            <button class="bt" onclick="obektZatvoriKutiya()">затвори</button>
        </div>
    </div>
</div>
<div id="moment-kutiya" onclick="if(event.target===this)momentZatvoriKutiya()">
    <div class="kutiya-list">
        <div id="moment-kutiya-telo"></div>
        <div style="margin-top:14px;text-align:right">
            <button class="bt" onclick="momentZatvoriKutiya()">затвори</button>
        </div>
    </div>
</div>

<!-- Кухня: съставките се разпознават от същия модул, който старото ПВА ползва.
     Нищо в него не се пипа — чете се. -->
<script src="../js/05-proverki.js"></script>
<!-- Сметките с идеалните части — най-опасното за преписване. Викат се,
     не се копират; `most.js` им показва къде са данните. -->
<script src="../js/01-osnova.js"></script>
<script src="../js/07-sobstvenost.js"></script>

<!-- Повърхност -->
<script src="yadro.js"></script>
<script src="most.js"></script>
<script src="plot.js"></script>
<script src="obekt.js"></script>
<script src="moment.js"></script>
<script src="proekt.js"></script>
<script src="sobstvenost.js"></script>

<script>
// Къде сме:
//   #/plot
//   #/obekt/<id>/<строеж>[?chislo=nachalo|podpis]
//   #/moment/<id>/<строеж>/<момент>
//   #/proekt/<id>/<строеж>
//   #/sobstvenost/<id>/<строеж>
function aktKade() {
    const h = location.hash.replace(/^#\/?/, '');
    const [pat, opashka] = h.split('?');
    const chasti = pat.split('/').filter(Boolean).map(decodeURIComponent);
    const chislo = /chislo=(\w+)/.exec(opashka || '');
    return { ekran: chasti[0] || 'plot', id: chasti[1], i: chasti[2] || 0,
             moment: chasti[3] || '', chislo: chislo ? chislo[1] : '' };
}

function aktPokazhi() {
    const k = aktKade();
    const ekran = !k.id ? 'plot'
        : k.ekran === 'moment' && k.moment ? 'moment'
        : k.ekran === 'proekt' ? 'proekt'
        : k.ekran === 'sobstvenost' ? 'sobstvenost'
        : k.ekran === 'obekt' ? 'obekt' : 'plot';
    for (const x of ['plot', 'obekt', 'moment', 'proekt', 'sobstvenost'])
        document.getElementById('ekran-' + x).hidden = x !== ekran;
    document.getElementById('shapka-plot').hidden = ekran !== 'plot';
    document.getElementById('shapka-nazad').hidden = ekran === 'plot';
    // От момента се връщаш в обекта, не чак на плота.
    // От момента и от проекта се връщаш в обекта, не чак на плота.
    const vObekta = ekran === 'moment' || ekran === 'proekt' || ekran === 'sobstvenost';
    document.getElementById('shapka-nazad').href = vObekta
        ? `#/obekt/${encodeURIComponent(k.id)}/${k.i}` : '#/plot';
    document.getElementById('shapka-nazad').textContent = vObekta
        ? '← обектът' : '← плотът';
    if (ekran === 'plot') plotRisuvai();
    else if (ekran === 'obekt') obektOtvori(k.id, k.i, k.chislo);
    else if (ekran === 'proekt') proektOtvori(k.id, k.i);
    else if (ekran === 'sobstvenost') sobstvenostOtvori(k.id, k.i);
    else {
        document.getElementById('moment-zaglavie').textContent = k.moment;
        momentOtvori(k.id, k.i, k.moment);
    }
}

window.addEventListener('hashchange', aktPokazhi);
aktZaredi();
plotSmeniIzgled('raboti');
aktPokazhi();
</script>

</body>
</html>
