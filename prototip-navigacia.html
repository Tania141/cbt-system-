<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКТ СИСТЕМ — предложение за навигация</title>
<style>

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #0f1923;
            --ink-2: #1e2d3d;
            --ink-3: #2c4058;
            --slate: #4a6785;
            --muted: #7b93ab;
            --border: #d0dbe6;
            --border-light: #e8f0f7;
            --surface: #f4f8fb;
            --surface-2: #eaf1f8;
            --white: #ffffff;
            --gold: #c9952a;
            --gold-light: #f0d080;
            --green: #2d7d52;
            --green-light: #e6f4ec;
            --red: #b33030;
            --red-light: #fce8e8;
            --blue: #1f6bb5;
            --blue-light: #e5f0fa;
            --r: 12px;
            --r-sm: 8px;
            --shadow: 0 2px 12px rgba(15,25,35,0.08);
            --shadow-md: 0 4px 24px rgba(15,25,35,0.12);
            --shadow-lg: 0 8px 40px rgba(15,25,35,0.16);
            --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ═══════════════════════════════════
           LAYOUT
        ═══════════════════════════════════ */
        .app-shell {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        /* ═══════════════════════════════════
           TOP BAR
        ═══════════════════════════════════ */
        .topbar {
            grid-column: 1 / -1;
            background: var(--ink);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            background: var(--gold);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Serif Display', serif;
            font-size: 16px;
            color: var(--ink);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-name {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--white);
            letter-spacing: -0.3px;
        }

        .brand-name span {
            color: var(--gold-light);
        }

        .topbar-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .topbar-date {
            font-size: 13px;
            color: var(--muted);
        }

        #dropbox-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        #dropbox-indicator.connected {
            background: rgba(45,125,82,0.2);
            color: #6fcf97;
        }

        #dropbox-indicator.disconnected {
            background: rgba(179,48,48,0.2);
            color: #f4a4a4;
        }

        #dropbox-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* ═══════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════ */
        .sidebar {
            background: var(--ink-2);
            padding: 24px 0;
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section-label {
            padding: 12px 24px 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 24px;
            color: #8fa8c0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: var(--transition);
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            color: var(--white);
            background: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            color: var(--white);
            background: rgba(201,149,42,0.15);
            border-left-color: var(--gold);
        }

        .nav-item .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .nav-badge {
            margin-left: auto;
            background: var(--gold);
            color: var(--ink);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            color: rgba(139,160,180,0.6);
        }

        /* ═══════════════════════════════════
           MAIN CONTENT
        ═══════════════════════════════════ */
        .main-content {
            padding: 32px;
            overflow-y: auto;
        }

        .page {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            gap: 16px;
        }

        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            color: var(--ink);
            line-height: 1.2;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--slate);
            margin-top: 4px;
        }

        /* ═══════════════════════════════════
           CARDS
        ═══════════════════════════════════ */
        .card {
            background: var(--white);
            border-radius: var(--r);
            border: 1px solid var(--border-light);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--slate);
            margin-top: 2px;
        }

        /* ═══════════════════════════════════
           FORMS
        ═══════════════════════════════════ */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .form-grid-full {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label.required::after {
            content: ' *';
            color: var(--red);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: var(--white);
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,149,42,0.12);
        }

        .form-input::placeholder { color: var(--muted); }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-hint {
            font-size: 12px;
            color: var(--muted);
        }

        /* ═══════════════════════════════════
           BUTTONS
        ═══════════════════════════════════ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border: none;
            border-radius: var(--r-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            text-decoration: none;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: var(--gold);
            color: var(--ink);
        }
        .btn-primary:hover:not(:disabled) { background: #b8841e; }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--ink-3);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover:not(:disabled) { background: var(--border-light); }

        .btn-success {
            background: var(--green);
            color: white;
        }
        .btn-success:hover:not(:disabled) { background: #236040; }

        .btn-danger {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid rgba(179,48,48,0.2);
        }
        .btn-danger:hover:not(:disabled) { background: #f5cece; }

        .btn-ghost {
            background: transparent;
            color: var(--slate);
        }
        .btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }

        .btn-lg {
            padding: 13px 28px;
            font-size: 15px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* ═══════════════════════════════════
           ALERTS
        ═══════════════════════════════════ */
        .alert {
            padding: 14px 18px;
            border-radius: var(--r-sm);
            margin-bottom: 16px;
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: var(--green-light);
            color: var(--green);
            border: 1px solid rgba(45,125,82,0.2);
        }

        .alert-error {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid rgba(179,48,48,0.2);
        }

        /* За неща, които не са грешка, но искат човешко око —
           напр. номер на заповедна книга, който не е вписан в регистъра. */
        .alert-warning {
            background: #fdf6e3;
            color: #8a6100;
            border: 1px solid rgba(138,97,0,0.2);
        }

        .alert-info {
            background: var(--blue-light);
            color: var(--blue);
            border: 1px solid rgba(31,107,181,0.2);
        }

        /* ═══════════════════════════════════
           BADGES
        ═══════════════════════════════════ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-green { background: var(--green-light); color: var(--green); }
        .badge-blue { background: var(--blue-light); color: var(--blue); }
        .badge-gold { background: rgba(201,149,42,0.12); color: var(--gold); }
        .badge-gray { background: var(--surface-2); color: var(--slate); }

        /* ═══════════════════════════════════
           STATS ROW
        ═══════════════════════════════════ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--r);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
            color: var(--ink);
            line-height: 1;
        }

        .stat-meta {
            font-size: 12px;
            color: var(--slate);
            margin-top: 4px;
        }

        /* ═══════════════════════════════════
           PASSPORT LIST / TABLE
        ═══════════════════════════════════ */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
        }

        .search-input-wrap .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 15px;
        }

        .search-input-wrap input {
            padding-left: 38px;
        }

        .filter-select {
            width: 180px;
        }

        .passport-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .passport-card {
            background: var(--white);
            border: 1.5px solid var(--border-light);
            border-radius: var(--r);
            padding: 18px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .passport-card:hover {
            border-color: var(--gold);
            box-shadow: var(--shadow-md);
        }

        .passport-card.selected {
            border-color: var(--gold);
            background: rgba(201,149,42,0.03);
        }

        .passport-pi {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--ink);
            line-height: 1;
        }

        .passport-pi-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .passport-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .passport-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .passport-details {
            font-size: 13px;
            color: var(--slate);
        }

        .passport-docs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .passport-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ═══════════════════════════════════
           EXCEL EXPORT STATUS
        ═══════════════════════════════════ */
        .export-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .export-indicator.exported {
            background: var(--green-light);
            color: var(--green);
        }

        .export-indicator.not-exported {
            background: rgba(201,149,42,0.1);
            color: var(--gold);
        }

        /* ═══════════════════════════════════
           HISTORY TIMELINE
        ═══════════════════════════════════ */
        .timeline {
            position: relative;
            padding-left: 24px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 16px;
        }

        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border);
            z-index: 1;
        }

        .timeline-dot.create { border-color: var(--green); background: var(--green); }
        .timeline-dot.edit { border-color: var(--gold); background: var(--gold); }
        .timeline-dot.export { border-color: var(--blue); background: var(--blue); }
        .timeline-dot.generate { border-color: var(--ink-3); background: var(--ink-3); }

        .timeline-content {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--r-sm);
            padding: 12px 14px;
        }

        .timeline-action {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }

        .timeline-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .timeline-detail {
            font-size: 12px;
            color: var(--slate);
            margin-top: 4px;
        }

        /* ═══════════════════════════════════
           CONSULTANT / EMPLOYEE CARDS
        ═══════════════════════════════════ */
        .consultant-card {
            background: var(--white);
            border: 1.5px solid var(--border-light);
            border-radius: var(--r);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .consultant-card-header {
            background: linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .consultant-card-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--white);
        }

        .consultant-card-eik {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .consultant-card-body {
            padding: 16px 20px;
        }

        .emp-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin: 3px;
        }

        .emp-chip .spec {
            color: var(--slate);
        }

        /* ═══════════════════════════════════
           DYNAMIC ROW (employees/projectants)
        ═══════════════════════════════════ */
        .dynamic-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--r-sm);
        }

        .dynamic-row input, .dynamic-row select {
            margin: 0;
        }

        /* ═══════════════════════════════════
           DROPBOX SECTION
        ═══════════════════════════════════ */
        .dropbox-card {
            background: linear-gradient(135deg, #0061ff15, #60efff10);
            border: 1.5px solid #0061ff30;
            border-radius: var(--r);
            padding: 24px;
        }

        /* ═══════════════════════════════════
           MODAL
        ═══════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,25,35,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.15s ease;
        }

        .modal {
            background: var(--white);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .modal-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--ink);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* ═══════════════════════════════════
           TABS (within cards)
        ═══════════════════════════════════ */
        .card-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border-light);
            margin-bottom: 20px;
        }

        .card-tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            transition: var(--transition);
        }

        .card-tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        /* ═══════════════════════════════════
           EMPTY STATE
        ═══════════════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: var(--slate);
            margin-bottom: 20px;
        }

        /* ═══════════════════════════════════
           SPINNER
        ═══════════════════════════════════ */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══════════════════════════════════
           DIVIDERS
        ═══════════════════════════════════ */
        .divider {
            height: 1px;
            background: var(--border-light);
            margin: 20px 0;
        }

        /* ═══════════════════════════════════
           SECTION SEPARATOR
        ═══════════════════════════════════ */
        .section-sep {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 24px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-sep::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        /* ═══════════════════════════════════
           CHECKBOX STYLED
        ═══════════════════════════════════ */
        .check-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--r-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .check-row:hover {
            border-color: var(--gold);
            background: rgba(201,149,42,0.03);
        }

        .check-row input[type="checkbox"], .check-row input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .check-row label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
        }

        /* ═══════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════ */
        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            .sidebar {
                height: auto;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 8px;
            }
            .sidebar-section-label { display: none; }
            .nav-item {
                flex: none;
                border-left: none;
                border-radius: 6px;
                padding: 8px 14px;
            }
            .nav-item.active { border-left: none; }
        }

        /* ═══════════════════════════════════
           MATERIAL DESIGN ENHANCEMENTS
        ═══════════════════════════════════ */

        /* Ripple effect on buttons */
        .btn { position: relative; overflow: hidden; }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.15);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .btn:active::after { opacity: 1; }

        /* Elevated cards with hover lift */
        .card {
            transition: box-shadow 0.2s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        .card:hover { box-shadow: var(--shadow-md); }

        /* Material chips for specializations */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            background: var(--surface-2);
            color: var(--slate);
            border: 1px solid var(--border);
            margin: 2px;
        }
        .chip.chip-gold { background: rgba(201,149,42,0.1); color: var(--gold); border-color: rgba(201,149,42,0.3); }
        .chip.chip-green { background: var(--green-light); color: var(--green); border-color: rgba(45,125,82,0.3); }
        .chip.chip-blue { background: var(--blue-light); color: var(--blue); border-color: rgba(31,107,181,0.3); }

        /* Timeline improvements */
        .timeline { position: relative; padding-left: 0; }
        .timeline-item {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            margin-top: 5px;
        }
        .timeline-dot.create { background: var(--green); }
        .timeline-dot.edit { background: var(--blue); }
        .timeline-dot.export { background: var(--gold); }
        .timeline-dot.generate { background: #9b59b6; }
        .timeline-dot.delete { background: var(--red); }
        .timeline-content { flex: 1; }
        .timeline-action { font-size: 13px; font-weight: 600; color: var(--ink); }
        .timeline-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .timeline-detail { font-size: 12px; color: var(--slate); margin-top: 2px; }

        /* Passport card hover indicator */
        .passport-card { position: relative; }
        .passport-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: transparent;
            border-radius: var(--r) 0 0 var(--r);
            transition: background 0.18s;
        }
        .passport-card:hover::before { background: var(--gold); }
        .passport-card.selected::before { background: var(--gold); }

        /* API status indicator reuse connected/disconnected */
        #api-indicator.connected {
            background: rgba(45,125,82,0.2);
            color: #6fcf97;
        }
        #api-indicator.disconnected {
            background: rgba(179,48,48,0.2);
            color: #f4a4a4;
        }

        /* Projectant block improved */
        .projectant-block {
            border: 1.5px solid var(--border-light);
            border-radius: var(--r-sm);
            padding: 14px;
            margin-bottom: 10px;
            background: var(--surface);
            transition: border-color 0.18s;
        }
        .projectant-block:hover { border-color: var(--gold); }
        .projectant-block-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .projectant-number {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--ink);
            font-size: 12px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* Progress indicator for passport completeness */
        .completeness-bar {
            height: 4px;
            border-radius: 2px;
            background: var(--border-light);
            overflow: hidden;
            margin-top: 6px;
        }
        .completeness-fill {
            height: 100%;
            border-radius: 2px;
            background: var(--green);
            transition: width 0.4s ease;
        }

        /* ── Login screen ───────────────────────────────────── */
        #login-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--surface);
            align-items: center;
            justify-content: center;
        }
        #login-screen.active { display: flex; }
        .login-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--r);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .login-brand .brand-mark {
            width: 44px; height: 44px; font-size: 14px;
        }
        .login-brand .brand-name {
            font-size: 20px; font-weight: 700; color: var(--ink);
            letter-spacing: -0.3px;
        }
        .login-brand .brand-name span { color: var(--gold); }
        .login-title {
            font-family: 'DM Serif Display', serif;
            font-size: 26px;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--slate);
            margin-bottom: 28px;
        }
        .login-error {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid rgba(179,48,48,0.2);
            border-radius: var(--r-sm);
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.visible { display: block; }

        /* Section separator */
        .section-sep {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            padding: 10px 0 6px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 14px;
        }

        /* Generated docs list */
        .doc-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: var(--r-sm);
            margin-bottom: 6px;
            font-size: 13px;
            background: var(--white);
        }
        .doc-list-item:hover { background: var(--surface); }
        .doc-list-item .doc-type { font-weight: 600; color: var(--ink); }
        .doc-list-item .doc-date { font-size: 11px; color: var(--muted); }

        /* ── Акт 15 doc-card ── */
        .doc-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            transition: var(--transition);
        }
        .doc-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
        .doc-card-icon { font-size: 32px; }
        .doc-card-title { font-weight: 700; font-size: 16px; color: var(--ink); }
        .doc-card-desc { font-size: 13px; color: var(--muted); }

        /* ── Modal form helpers ── */
        .btn-close {
            background: none; border: none; font-size: 18px;
            color: var(--muted); cursor: pointer; padding: 4px 8px;
            border-radius: 6px; line-height: 1;
        }
        .btn-close:hover { background: var(--surface-2); color: var(--ink); }
        .form-section { margin-bottom: 20px; }
        .form-section h4 { font-size: 14px; font-weight: 700; color: var(--slate); margin: 0 0 10px; border-bottom: 1px solid var(--border-light); padding-bottom: 6px; }
        .form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .form-row label { min-width: 220px; font-size: 13px; color: var(--slate); flex-shrink: 0; }
        .form-row input[type="text"], .form-row input[type="file"] { flex: 1; font-size: 13px; }
        .form-row input[type="text"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
        .form-row input[type="text"]:focus { outline: none; border-color: var(--gold); }

<script>
// Прототипът показва САМО навигацията: къде какво живее и какво отпада.
// Полетата нарочно ги няма — въпросът тук е подредбата, не формата.
const STRANICI = {
    obekti: {
        zaglavie: 'Обекти',
        podzaglavie: 'Паспортите на строежите',
        tyalo: `<p>Тук е списъкът на обектите и се отваря паспортът. <b>Това става началната
        страница</b> вместо Таблото — то показваше две справки и нищо, което се прави.</p>
        <p>Всеки ред казва в коя фаза е обектът, за да се вижда веднага дали още се оценява
        проектът, или вече текат актовете.</p>
        <p class="proto-mahnato"><b>Отпада от паспорта:</b> „Генерирай документи“ ·
        „Експорт Excel“ · „Sync API“ (записът и без това минава през базата).</p>
        <p>Историята на генерираните документи за обекта си остава там, където е —
        в История. Не се дублира тук.</p>`,
        beleжka: 'Паспортът описва обекта; не произвежда документи. Днешният бутон „Генерирай документи“ само прехвърля към страницата за генериране, но изглежда като че ли документът се прави оттук — и заобикаля мястото, където стоят подробностите за всеки образец. Генериране има само в „Актове и протоколи“ и „AI протоколи“.'
    },
    osip: {
        zaglavie: 'Оценка на съответствието',
        podzaglavie: 'Комплексен доклад по чл. 142 ЗУТ',
        tyalo: `<p>Признаци на обекта, категорията с правното ѝ основание, проверката на цитата
        срещу Наредба № 1, текстовете от библиотеката и нормативният списък.</p>
        <p>Сега всичко това е притиснато в няколко карти по средата на четириекранна форма.</p>`
    },
    dokumenti: {
        zaglavie: 'Изходни документи',
        podzaglavie: 'Собственост, устройствена основа, съгласувания, разрешителни',
        tyalo: `<p>Вписват се наличните документи; чеклистът казва кои се изискват за този обект
        и кои липсват — с условието, при което се искат.</p>`,
        beleжka: 'Отделна страница, защото това е работа на цял един ден и не е „още една карта“ в паспорта.'
    },
    normativna: {
        zaglavie: 'Нормативна уредба',
        podzaglavie: 'Заключени източници, матрица и цитати',
        tyalo: `<p>Кои закони и наредби вижда системата, съвпадат ли с отпечатъка си, и сверката
        на пастнатите цитати.</p>
        <p>Днес това е закопано в Настройки, при положение че е основа на доклада, а не настройка.</p>`
    },
    aktove: {
        zaglavie: 'Актове и протоколи',
        podzaglavie: 'Генериране по Наредба № 3',
        tyalo: `<p>Избира се обект и документ; готовият <b>.docx</b> се сваля.</p>
        <p><b>Единственото място за генериране</b> заедно с „AI протоколи“. Тук стоят и
        подробностите за всеки образец — какво иска Протокол 12, кои участници се вписват,
        какво липсва в паспорта, за да излезе документът пълен.</p>
        <p>Затова генерирането не бива да се вика отвън: подробностите не пътуват с бутона.</p>`,
        beleжka: 'Проверката „какво липсва за този документ“ живее тук, защото е различна за всеки образец. В паспорта тя няма къде да се покаже. Системата може да докаже, че е СЪСТАВИЛА документа — за подписания може да свидетелства само сканирано досие. Дотогава всичко останало е „операторът така каза“.'
    },
    zk: {
        zaglavie: 'Заповедни книги',
        podzaglavie: 'Регистър и генериране',
        tyalo: `<p>Регистърът с начален номер и последователност, и предупреждението при заменена
        книга.</p>`
    },
    ai: {
        zaglavie: 'AI протоколи',
        podzaglavie: 'Четене на записки и чертежи',
        tyalo: `<p>Мястото на слой 2: AI чете обяснителните записки с цитати, кодът чете
        чертежите, чеклистът съди.</p>`
    },
    konsultanti: {
        zaglavie: 'Консултанти',
        podzaglavie: 'Фирми, лицензи и екипи',
        tyalo: `<p>Без промяна.</p>`
    },
    istoria: {
        zaglavie: 'История',
        podzaglavie: 'Какво е правено и от кого',
        tyalo: `<p><b>Тук идват двете справки от Таблото</b> — последни паспорти и последни
        действия. Те са справки; мястото им е при справките.</p>`
    },
    nastroyki: {
        zaglavie: 'Настройки',
        podzaglavie: 'Само това, което наистина се настройва',
        tyalo: `<p><b>Остава:</b> API URL, потребители и покани, заключени източници.</p>
        <p class="proto-mahnato"><b>Отпада:</b> Dropbox интеграция · Excel експорт ·
        картата „Python Автоматизация“ · индикаторът за Dropbox горе вдясно.</p>`,
        beleжka: 'Запис и списък на паспортите минават през базата от доста време. Excel остана само като главния бутон на формата — сваля passport.xlsx, за да се качи ръчно в Dropbox, откъдето Python скрипт да го чете. Този конвейер вече не съществува.'
    },
};

function pokazhi(kod) {
    const s = STRANICI[kod];
    document.querySelectorAll('.nav-item').forEach(b =>
        b.classList.toggle('active', b.dataset.p === kod));
    document.getElementById('proto-sadarjanie').innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">${s.zaglavie}</h1>
                <p class="page-subtitle">${s.podzaglavie}</p>
            </div>
        </div>
        <div class="proto-kutiya">${s.tyalo}</div>
        ${s.beleжka ? `<div class="proto-belejka">${s.beleжka}</div>` : ''}`;
}

document.querySelectorAll('.nav-item').forEach(b =>
    b.addEventListener('click', () => pokazhi(b.dataset.p)));

document.getElementById('current-date').textContent =
    new Date().toLocaleDateString('bg-BG',
        { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
pokazhi('obekti');
</script>
